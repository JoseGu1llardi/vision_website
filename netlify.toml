# =====================================================
# BUILD
# =====================================================
[build]
  command = "npm run build"
  publish = "out"

# =====================================================
# SECURITY HEADERS
# =====================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent the site from being embedded in iframes (clickjacking)
    X-Frame-Options = "DENY"

    # Stop browsers from MIME-sniffing the declared content type
    X-Content-Type-Options = "nosniff"

    # Only send origin as referrer on cross-origin requests
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable browser features not used by this site
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # Force HTTPS for 2 years once live on a real domain
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Content Security Policy:
    #   script-src  — 'unsafe-inline' required by Next.js static hydration
    #   img-src     — all images are self-hosted in /public
    #   frame-ancestors 'none' — stricter than X-Frame-Options, prevents all embedding
    #   form-action 'self'     — forms may only POST to the same origin
    #   base-uri 'self'        — blocks <base> tag injection attacks
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# =====================================================
# CACHING
# =====================================================
# Next.js build assets (JS, CSS, fonts) have a content hash in the filename,
# so a new deploy always gets new URLs — safe to cache forever
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optimized images keep the same filename when regenerated, so cache for a day
# and serve the cached copy while revalidating for up to a week after that
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
